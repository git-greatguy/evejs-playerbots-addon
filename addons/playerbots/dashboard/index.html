<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>EveJS Playerbots</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <aside class="rail">
    <a class="brand" href="#activity" aria-label="Playerbots home">
      <span class="brand-mark">E</span><span><strong>EveJS</strong><small>Playerbots</small></span>
    </a>
    <nav id="navigation" aria-label="Dashboard sections">
      <a class="nav-link" href="#activity" data-view="activity"><span class="nav-icon">◈</span>Activity</a>
      <a class="nav-link" href="#corporations" data-view="corporations"><span class="nav-icon">▤</span>Corporations</a>
      <a class="nav-link" href="#history" data-view="history"><span class="nav-icon">⌁</span>History</a>
      <a class="nav-link" href="#world" data-view="world"><span class="nav-icon">◎</span>World</a>
      <a class="nav-link" href="#performance" data-view="performance"><span class="nav-icon">∿</span>Performance</a>
      <a class="nav-link" href="#settings" data-view="settings"><span class="nav-icon">⚙</span>Settings</a>
    </nav>
    <div class="rail-bottom">
      <div class="row"><span id="connection-dot" class="live-dot"></span><span id="connection-state">Connecting…</span></div>
      <small id="uptime"></small>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"><strong>Activity</strong></div>
      <div class="top-actions"><span id="updated-at">Loading…</span><button id="refresh" class="btn small" type="button" title="Refresh now">↻ Refresh</button></div>
    </header>
    <div id="view" class="view" aria-live="polite"></div>
    <footer class="footer"><span>EveJS Playerbots add-on</span><span>Commands act as the server operator</span></footer>
  </main>

  <div id="drawer-root"></div>
  <dialog id="dialog"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
